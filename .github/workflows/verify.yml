name: Verify and publish retained previews
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-stage
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test Firebase access rules and live drafts
        run: bun run test:backend
      - name: Install Chromium for launch integration checks
        run: bunx playwright install --with-deps chromium
      - name: Test Game Room and tabletop entry with independent browsers
        run: bun run test:launch
      - name: Test trained bots in personal and tabletop play
        run: |
          bun run dev > /tmp/higher-powers-bots.log 2>&1 &
          BOT_PREVIEW_PID=$!
          trap 'kill "$BOT_PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5198/play > /dev/null; then break; fi
            sleep 1
          done
          bun run review:bots
          bun run review:overlap
          bun run review:confirm-draw
          bun run review:sanctuary
          bun run review:purgatory
          bun run review:visibility
      - name: Select production or retained PR path
        id: destination
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ -n "$PR_NUMBER" ]]; then
            echo "base=/$REPO_NAME/pr$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "directory=pr$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO_NAME" >> "$GITHUB_OUTPUT"
            echo "directory=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build for repository hosting
        run: bun run build
        env:
          PUBLIC_BASE_PATH: ${{ steps.destination.outputs.base }}
      - uses: actions/upload-artifact@v4
        with:
          name: higher-powers-gallery-rulebook-and-print-kit
          path: build/
          retention-days: 14
      - name: Retain this build on the Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          destination_dir: ${{ steps.destination.outputs.directory }}
          keep_files: true
      - name: Publish using the trusted main-branch workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
      - name: Link the retained preview in the workflow summary
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_BASE: https://${{ github.repository_owner }}.github.io${{ steps.destination.outputs.base }}
        run: |
          echo "Preview: $PREVIEW_BASE/" >> "$GITHUB_STEP_SUMMARY"
          echo "Play: $PREVIEW_BASE/play/" >> "$GITHUB_STEP_SUMMARY"
          echo "Components: $PREVIEW_BASE/gallery/" >> "$GITHUB_STEP_SUMMARY"
          echo "Rulebook: $PREVIEW_BASE/rules.html" >> "$GITHUB_STEP_SUMMARY"
          echo "Print & play: $PREVIEW_BASE/gallery/print/" >> "$GITHUB_STEP_SUMMARY"
